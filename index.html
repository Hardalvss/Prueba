<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <title>Tailwind Landing</title>
</head>
<body class="bg-gray-900">

  <!-- Header -->
  <header class="absolute inset-x-0 top-0 z-50">
    <nav class="flex items-center justify-between p-6 lg:px-8" aria-label="Global">
      <div class="flex lg:flex-1">
        <a href="#" class="-m-1.5 p-1.5">
          <span class="sr-only">Your Company</span>
          <img class="h-8 w-auto" src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" alt="logo">
        </a>
      </div>
      <!-- Botón menú móvil -->
      <div class="flex lg:hidden">
        <button id="btn-open" type="button" class="-m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-gray-200">
          <span class="sr-only">Open main menu</span>
          ☰
        </button>
      </div>
      <!-- Menú desktop -->
      <div class="hidden lg:flex lg:gap-x-12">
        <a href="#" class="text-sm font-semibold text-white">Product</a>
        <a href="#" class="text-sm font-semibold text-white">Features</a>
        <a href="#" class="text-sm font-semibold text-white">Marketplace</a>
        <a href="#" class="text-sm font-semibold text-white">Company</a>
      </div>
      <div class="hidden lg:flex lg:flex-1 lg:justify-end">
        <a href="#" class="text-sm font-semibold text-white">Log in <span aria-hidden="true">&rarr;</span></a>
      </div>
    </nav>

    <!-- Menú móvil -->
    <div id="mobile-menu" class="hidden lg:hidden fixed inset-y-0 right-0 z-50 w-full sm:max-w-sm bg-gray-900 p-6">
      <div class="flex items-center justify-between">
        <a href="#" class="-m-1.5 p-1.5">
          <img class="h-8 w-auto" src="https://tailwindcss.com/plus-assets/img/logos/mark.svg?color=indigo&shade=500" alt="logo">
        </a>
        <button id="btn-close" type="button" class="-m-2.5 rounded-md p-2.5 text-gray-200">✕</button>
      </div>
      <div class="mt-6">
        <a href="#" class="block px-3 py-2 text-base font-semibold text-white hover:bg-white/5 rounded-lg">Product</a>
        <a href="#" class="block px-3 py-2 text-base font-semibold text-white hover:bg-white/5 rounded-lg">Features</a>
        <a href="#" class="block px-3 py-2 text-base font-semibold text-white hover:bg-white/5 rounded-lg">Marketplace</a>
        <a href="#" class="block px-3 py-2 text-base font-semibold text-white hover:bg-white/5 rounded-lg">Company</a>
        <a href="#" class="block mt-4 px-3 py-2 text-base font-semibold text-white hover:bg-white/5 rounded-lg">Log in</a>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <div class="relative isolate px-6 pt-32 lg:px-8">
    <div class="mx-auto max-w-2xl py-16 sm:py-32 lg:py-40 text-center">
      <h1 class="text-5xl font-bold tracking-tight text-white sm:text-7xl">Data to enrich your online business</h1>
      <p class="mt-6 text-lg leading-8 text-gray-400">Anim aute id magna aliqua ad ad non deserunt sunt. Qui irure qui lorem cupidatat commodo.</p>
      <div class="mt-10 flex items-center justify-center gap-x-6">
        <a href="#" class="rounded-md bg-indigo-500 px-4 py-2.5 text-sm font-semibold text-white shadow hover:bg-indigo-400">Get started</a>
        <a href="#" class="text-sm font-semibold text-white">Learn more →</a>
      </div>
    </div>
  </div>

  <!-- Script menú móvil -->
  <script>
    const btnOpen = document.getElementById("btn-open");
    const btnClose = document.getElementById("btn-close");
    const mobileMenu = document.getElementById("mobile-menu");

    btnOpen.addEventListener("click", () => {
      mobileMenu.classList.remove("hidden");
    });

    btnClose.addEventListener("click", () => {
      mobileMenu.classList.add("hidden");
    });
  </script>
</body>
</html>
