  <meta charset="UTF-8">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="asens/css/styles.css">
</head>
<body class="bg-light text-dark d-flex flex-column min-vh-100">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <!-- Logo + Nombre -->
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="asens/img/logo.png" alt="Urban C" width="40" height="40" class="me-2 rounded-circle">
        <span class="fw-bold">Urban C</span>
      </a>

      <!-- Botón hamburguesa móvil -->
      <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Enlaces -->
      <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="blogs.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
          <li class="nav-item"><a class="nav-link active" href="registro.html">Registrar</a></li>
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-cart"></i> Carrito (0)</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="flex-grow-1 d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card shadow-lg bg-white text-dark">
            <div class="card-body p-4">
              <h2 class="text-center fw-bold mb-4 text-dark">Crear Cuenta</h2>

              <!-- Formulario -->
              <form id="registroForm">
                <!-- Nombre -->
                <div class="mb-3">
                  <label for="nombre" class="form-label">
                    <i class="bi bi-person-fill me-2"></i>Nombre completo
                  </label>
                  <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label for="email" class="form-label">
                    <i class="bi bi-envelope-fill me-2"></i>Correo electrónico
                  </label>
                  <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
                </div>

                <!-- Dirección -->
                <div class="mb-3">
                  <label for="direccion" class="form-label">
                    <i class="bi bi-geo-alt-fill me-2"></i>Dirección
                  </label>
                  <input type="text" class="form-control" id="direccion" placeholder="Calle y número" required>
                </div>

                <!-- Comuna -->
                <div class="mb-3">
                  <label for="comuna" class="form-label">
                    <i class="bi bi-geo me-2"></i>Comuna
                  </label>
                  <input type="text" class="form-control" id="comuna" placeholder="Renca" required>
                </div>

                <!-- Contraseña -->
                <div class="mb-3">
                  <label for="password" class="form-label">
                    <i class="bi bi-lock-fill me-2"></i>Contraseña
                  </label>
                  <input type="password" class="form-control" id="password" placeholder="********" required>
                </div>

                <!-- Confirmar Contraseña -->
                <div class="mb-3">
                  <label for="confirmPassword" class="form-label">
                    <i class="bi bi-lock-fill me-2"></i>Confirmar contraseña
                  </label>
                  <input type="password" class="form-control" id="confirmPassword" placeholder="********" required>
                </div>

                <!-- Botón -->
                <div class="d-grid">
                  <button type="submit" class="btn btn-dark fw-bold">
                    <i class="bi bi-person-plus-fill me-2"></i>Registrarse
                  </button>
                </div>
              </form>

              <!-- Link login -->
              <p class="text-center mt-3 mb-0">
                ¿Ya tienes cuenta? 
                <a href="login.html" class="text-warning fw-bold">Inicia sesión</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center py-3 bg-dark text-light mt-auto">
    <p class="mb-0">&copy; 2025 Urban C - Todos los derechos reservados</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- JS personalizado -->
  <script src="asens/js/registro.js"></script>
</body>
</html>
