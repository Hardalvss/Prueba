<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban C - Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="asens/css/styles.css">
</head>
<body class="bg-dark d-flex align-items-center" style="min-height: 100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        
        <div class="card shadow-lg">
          <div class="card-body p-4">
            <h2 class="text-center fw-bold mb-4 text-warning">Crear Cuenta</h2>
            
            <form id="registroForm">
              <!-- Nombre -->
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" required>
              </div>
              
              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
              </div>

              <!-- Direccion -->
              <div class="mb-3">
                <label for="Direccion" class="form-label">Direccion</label>
                <input type="text" class="form-control" id="Direccion" placeholder="Direccion" required>
              </div>

              <!-- Comuna -->
              <div class="mb-3">
                <label for="Comuna" class="form-label">Comuna</label>
                <input type="text" class="form-control" id="Comuna" placeholder="Renca" required>
              </div>
              
              <!-- Contraseña -->
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" placeholder="********" required>
              </div>
              
              <!-- Confirmar Contraseña -->
              <div class="mb-3">
                <label for="password2" class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="********" required>
              </div>
              
              <!-- Botón -->
              <div class="d-grid">
                <button type="submit" class="btn btn-warning">Registrarse</button>
              </div>
            </form>

            <!-- Link login -->
            <p class="text-center mt-3 mb-0">
              ¿Ya tienes cuenta? <a href="login.html" class="text-warning fw-bold">Inicia sesión</a>
            </p>
          </div>
        </div>
        
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="asens/js/registro.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
