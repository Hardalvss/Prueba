<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban C - Carrito</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="asens/css/styles.css">
</head>
<body class="bg-light text-dark d-flex flex-column min-vh-100">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="asens/img/logo.png" alt="Urban C" width="40" height="40" class="me-2 rounded-circle">
        <span class="fw-bold">Urban C</span>
      </a>
      <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="blogs.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link active" href="carrito.html"><i class="bi bi-cart"></i> Carrito</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="login.html">Iniciar sesión</a></li>
          <li class="nav-item"><a class="nav-link" href="registro.html">Registrar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="flex-grow-1">
    <section class="py-5">
      <div class="container">
        <h1 class="fw-bold mb-4 text-center">🛒 Tu Carrito</h1>

        <!-- Tabla de productos -->
        <div class="table-responsive">
          <table class="table table-bordered align-middle text-center">
            <thead class="table-dark">
              <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Total</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody id="carrito-body">
              <!-- Aquí se van a cargar los productos con JS -->
            </tbody>
          </table>
        </div>

        <!-- Resumen -->
        <div class="d-flex justify-content-end mt-4">
          <div class="card p-4 shadow" style="max-width: 300px;">
            <h5 class="fw-bold">Resumen</h5>
            <p><strong>Subtotal:</strong> <span id="subtotal">$0</span></p>
            <p><strong>Envío:</strong> <span id="envio">$3.990</span></p>
            <h5><strong>Total:</strong> <span id="total">$0</span></h5>
            <button class="btn btn-success w-100 mt-3">Finalizar Compra</button>
          </div>
        </div>
      </div>
    </section>
  </main>

    <!-- ================= FOOTER ================= -->
<footer class="footer text-light py-4">
  <div class="container text-center">

    <!-- Marca -->
    <h5 class="fw-bold text-light mb-3">Urban C</h5>

    <!-- Enlaces -->
    <nav class="mb-3">
      <a href="index.html" class="footer-link mx-2">Inicio</a>
      <a href="productos.html" class="footer-link mx-2">Productos</a>
      <a href="nosotros.html" class="footer-link mx-2">Nosotros</a>
      <a href="contacto.html" class="footer-link mx-2">Contacto</a>
    </nav>

    <!-- Redes sociales -->
    <div class="mb-3">
      <a href="#" class="social-link mx-2"><i class="bi bi-instagram"></i></a>
      <a href="#" class="social-link mx-2"><i class="bi bi-facebook"></i></a>
      <a href="#" class="social-link mx-2"><i class="bi bi-tiktok"></i></a>
    </div>

    <!-- Derechos -->
    <small class="text-white-50">
      &copy; 2025 <span class="text-light">Urban C</span>. Todos los derechos reservados.
    </small>

  </div>
</footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Script carrito -->
  <script src="asens/js/carrito.js"></script>
</body>
</html>
