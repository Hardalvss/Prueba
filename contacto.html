<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban C - Contacto</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="asens/css/styles.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
      }
    </style>
  </head>
  <body class="bg-dark text-light">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Urban C</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="productos.html">Productos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="detalle-producto.html"
                >Detalle Producto</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contacto.html">Contacto</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="bg-dark text-light">
      <!-- FORMULARIO -->
      <div class="container my-5">
        <h2 class="text-center fw-bold mb-4">Contáctanos</h2>
        <div class="row justify-content-center">
          <div class="col-md-8">
            <div class="card bg-secondary text-light shadow-lg p-4">
              <form id="contactForm">
                <div class="mb-3">
                  <label for="nombre" class="form-label"
                    ><i class="bi bi-person-fill me-2"></i>Nombre</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    placeholder="Tu nombre completo"
                  />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label"
                    ><i class="bi bi-envelope-fill me-2"></i>Correo
                    electrónico</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="ejemplo@correo.com"
                  />
                </div>
                <div class="mb-3">
                  <label for="telefono" class="form-label"
                    ><i class="bi bi-telephone-fill me-2"></i>Teléfono</label
                  >
                  <input
                    type="tel"
                    class="form-control"
                    id="telefono"
                    placeholder="+56 9 1234 5678"
                  />
                </div>
                <div class="mb-3">
                  <label for="mensaje" class="form-label"
                    ><i class="bi bi-chat-dots-fill me-2"></i>Mensaje</label
                  >
                  <textarea
                    class="form-control"
                    id="mensaje"
                    rows="4"
                    placeholder="Escribe tu mensaje aquí..."
                  ></textarea>
                </div>
                <button
                  type="submit"
                  class="btn btn-light text-dark w-100 fw-bold"
                >
                  <i class="bi bi-send-fill me-2"></i>Enviar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- INFO EXTRA -->
      <div class="container text-center my-5">
        <p>
          <i class="bi bi-envelope-fill me-2"></i
          ><strong>Email:</strong> contacto@urbanc.cl
        </p>
        <p>
          <i class="bi bi-whatsapp me-2"></i><strong>WhatsApp:</strong> +56 9
          1234 5678
        </p>
        <p>
          <i class="bi bi-instagram me-2"></i><strong>Instagram:</strong>
          <a href="#" class="text-decoration-none text-light">@urban_c</a>
        </p>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-3 bg-black mt-auto">
      <p class="mb-0">&copy; 2025 Urban C - Todos los derechos reservados</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Tu JS -->
    <script src="asens/js/contacto.js"></script>
  </body>
</html>
