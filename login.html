<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban C - Login</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="asens/css/styles.css">
</head>
<body class="bg-light text-dark d-flex flex-column min-vh-100">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <!-- Logo + Nombre -->
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="asens/img/logo.png" alt="Urban C" width="40" height="40" class="me-2 rounded-circle">
        <span class="fw-bold">Urban C</span>
      </a>

      <!-- Botón hamburguesa móvil -->
      <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Enlaces -->
      <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="blogs.html">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link active" href="login.html">Iniciar sesión</a></li>
          <li class="nav-item"><a class="nav-link" href="registro.html">Registrar</a></li>
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-cart"></i> Carrito (0)</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="flex-grow-1 d-flex align-items-center">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card p-4 shadow-lg bg-white text-dark">
            <h3 class="text-center mb-3 text-dark">Iniciar Sesión</h3>
            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">
                  <i class="bi bi-envelope-fill me-2"></i>Correo
                </label>
                <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">
                  <i class="bi bi-lock-fill me-2"></i>Contraseña
                </label>
                <input type="password" class="form-control" id="password" placeholder="********" required>
              </div>
              <button type="submit" class="btn btn-dark w-100 fw-bold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
              </button>
            </form>
            <p class="mt-3 text-center">
              ¿No tienes cuenta? 
              <a href="registro.html" class="text-warning fw-bold">Regístrate aquí</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center py-3 bg-dark text-light mt-auto">
    <p class="mb-0">&copy; 2025 Urban C - Todos los derechos reservados</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS personalizado -->
  <script src="asens/js/login.js"></script>
</body>
</html>
