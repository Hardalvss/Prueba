<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Urban C</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
      <h3 class="text-center mb-3 text-warning">Iniciar Sesión</h3>
      <form id="loginForm">
        <div class="mb-3">
          <label for="email" class="form-label">Correo</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-warning w-100">Ingresar</button>
      </form>
      <p class="mt-3 text-center">
        ¿No tienes cuenta? <a href="registro.html" class="text-warning">Regístrate aquí</a>
      </p>
    </div>
  </div>

  <!-- enlazamos el js -->
  <script src="login.js"></script>
</body>
</html>
